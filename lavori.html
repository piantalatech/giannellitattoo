<!-- Contenitore lightbox -->
<div id="lightbox-overlay">
  <span id="lightbox-close">&times;</span>
  <span id="lightbox-prev">&#10094;</span>
  <img id="lightbox-img" src="" alt="">
  <span id="lightbox-next">&#10095;</span>
</div>


<footer>
  <p>&copy; 2025 GIANNELLI TATTOO. Tutti i diritti riservati.</p>
</footer>



<script>
  const links = document.querySelectorAll('.lightbox');
  const overlay = document.getElementById('lightbox-overlay');
  const overlayImg = document.getElementById('lightbox-img');
  const closeBtn = document.getElementById('lightbox-close');
  const nextBtn = document.getElementById('lightbox-next');
  const prevBtn = document.getElementById('lightbox-prev');

  let currentIndex = 0;

  function showImage(index) {
    const imageLink = links[index].getAttribute('href');
    overlayImg.src = imageLink;
    overlay.style.display = 'flex';
    currentIndex = index;
  }

  links.forEach((link, index) => {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      showImage(index);
    });
  });

  closeBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    overlayImg.src = '';
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % links.length;
    showImage(currentIndex);
  });

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + links.length) % links.length;
    showImage(currentIndex);
  });

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
      overlay.style.display = 'none';
      overlayImg.src = '';
    }
  });
</script>
